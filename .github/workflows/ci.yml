name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # builds, zips and verifies every platform as version 0.0.0-dev, without publishing

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vet, test, build and verify in the pinned Go image
        run: ./build.sh --version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libraries-linux
          path: dist/*/expiring-quota-first.so
          if-no-files-found: error
          retention-days: 7

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin_amd64, runner: macos-15-intel, extension: dylib }
          - { target: darwin_arm64, runner: macos-15, extension: dylib }
          - { target: windows_amd64, runner: windows-2025, extension: dll }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Vet and test on this platform
        run: go vet ./... && go test ./...
      - name: Install a current bash # macOS ships bash 3.2; the scripts need 5.2
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Build the library
        run: |
          bash="bash"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash="$(brew --prefix)/bin/bash"
          fi
          "$bash" scripts/build-library.sh --version "${RELEASE_TAG#v}" --platform "${TARGET/_/\/}" --out "dist/$TARGET/expiring-quota-first.$EXTENSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-${{ matrix.target }}
          path: dist/*/expiring-quota-first.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [linux, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: librar*
          merge-multiple: true
          path: dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Zip, checksum and verify every platform with CLIProxyAPI's plugin store code
        run: scripts/package-release.sh --version "${RELEASE_TAG#v}" --libraries dist --out dist/release
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cliproxyapi="$(sed -n 's#^[[:space:]]*github.com/router-for-me/CLIProxyAPI/v8 \(v[0-9.]*\)$#\1#p' go.mod)"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes "Built for CLIProxyAPI ${cliproxyapi}. Install it through CLIProxyAPI's plugin store with this repository's registry.json added as a store source, as the README shows, or unzip the file for your platform into CLIProxyAPI's plugins folder." \
            --generate-notes \
            dist/release/*.zip dist/release/checksums.txt
      - name: Install the published release with CLIProxyAPI's plugin store code
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release.sh --tag "$RELEASE_TAG"
