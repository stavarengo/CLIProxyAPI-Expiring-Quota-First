name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vet, test, build and verify
        env:
          REF_NAME: ${{ github.ref_name }}
        run: ./build.sh --version "${REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cliproxyapi="$(sed -n 's#^[[:space:]]*github.com/router-for-me/CLIProxyAPI/v8 \(v[0-9.]*\)$#\1#p' go.mod)"
          gh release create "$REF_NAME" --verify-tag --title "$REF_NAME" \
            --notes "Built for CLIProxyAPI ${cliproxyapi}. Install it through CLIProxyAPI's plugin store with this repository's registry.json added as a store source, as the README shows, or unzip the file for your platform into CLIProxyAPI's plugins folder." \
            --generate-notes \
            dist/release/*.zip dist/release/checksums.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Install the published release with CLIProxyAPI's plugin store code
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/verify-release.sh --tag "$REF_NAME"
